<section>
  <mat-accordion multi>
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon>shopping_cart</mat-icon>
          Košík
        </mat-panel-title>
        <mat-card-subtitle>Požičané knihy: {{ books().length }} / 10</mat-card-subtitle>
      </mat-expansion-panel-header>

      <mat-card-content>
        @for (book of books(); track book.id) {
          <div class="cart-item">
            <span>{{ book.title }}</span>
            <button matButton="outlined" (click)="giveBack(book)">Vrátiť</button>
          </div>
        } @empty {
          <p class="empty">Zatiaľ nemáš požičanú žiadnu knihu.</p>
        }
      </mat-card-content>
    </mat-expansion-panel>
  </mat-accordion>
</section>
